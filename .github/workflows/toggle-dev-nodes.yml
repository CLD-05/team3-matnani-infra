name: Toggle Dev EKS Nodes

on:
  workflow_dispatch:
    inputs:
      node_desired:
        description: "Desired EKS node count for dev"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "2"
          - "3"
          - "4"

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-infra-terraform
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ROLE_ARN: arn:aws:iam::495599735720:role/team3-matnani-dev-gha-role
  TF_VERSION: "1.15.0"

jobs:
  apply-infrastructure:
    name: Toggle dev node count
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/envs/dev/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init

      - name: Apply selected node count
        env:
          NODE_DESIRED: ${{ github.event.inputs.node_desired }}
        run: |
          set -euo pipefail

          COMMON_ARGS="-lock-timeout=5m -var-file=terraform.ci.tfvars -var=node_desired=${NODE_DESIRED}"

          if [ "${NODE_DESIRED}" = "0" ]; then
            echo "Scaling EKS nodes down to 0 before removing NAT resources."
            terraform apply -auto-approve -target=module.eks ${COMMON_ARGS}

            echo "Applying full dev infra with node_desired=0."
            terraform apply -auto-approve ${COMMON_ARGS}
          else
            echo "Ensuring NAT resources exist before scaling EKS nodes to ${NODE_DESIRED}."
            terraform apply -auto-approve -target=module.network ${COMMON_ARGS}

            echo "Applying full dev infra with node_desired=${NODE_DESIRED}."
            terraform apply -auto-approve ${COMMON_ARGS}
          fi
