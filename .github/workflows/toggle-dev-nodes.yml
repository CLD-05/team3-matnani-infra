name: Toggle Dev EKS Nodes

on:
  workflow_dispatch:
    inputs:
      node_desired:
        description: "변경할 dev EKS 노드 수"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "2"
          - "3"
          - "4"

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-infra-terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ROLE_ARN: arn:aws:iam::495599735720:role/team3-matnani-dev-gha-role
  TF_VERSION: "1.15.0"

jobs:
  apply-infrastructure:
    name: Toggle dev EKS nodes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/envs/dev/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init

      - name: Apply selected node count
        env:
          NODE_DESIRED: ${{ inputs.node_desired }}
        run: |
          set -euo pipefail

          TF_ARGS=(
            -auto-approve
            -input=false
            -lock-timeout=5m
            -var-file=terraform.ci.tfvars
            "-var=node_desired=${NODE_DESIRED}"
          )

          if [ "${NODE_DESIRED}" = "0" ]; then
            echo "EKS 노드를 먼저 0개로 축소합니다."
            terraform apply -target=module.eks "${TF_ARGS[@]}"

            echo "전체 인프라에 node_desired=0을 적용해 NAT Gateway를 정리합니다."
            terraform apply "${TF_ARGS[@]}"
          else
            echo "EKS 노드 생성 전에 NAT Gateway를 준비합니다."
            terraform apply -target=module.network "${TF_ARGS[@]}"

            echo "전체 인프라에 node_desired=${NODE_DESIRED}을 적용합니다."
            terraform apply "${TF_ARGS[@]}"
          fi
