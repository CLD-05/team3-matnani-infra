name: 🎛️ Dev Env - Toggle EKS Nodes & NAT

on:
  workflow_dispatch:
    inputs:
      node_desired:
        description: 'EKS 노드 개수 (0: 비용 0원 모드 / 2: 기본 운영 모드)'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '2'

        
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ROLE_ARN: arn:aws:iam::495599735720:role/team3-matnani-dev-gha-role
  TF_VERSION: "1.15.0"


jobs:
  apply-infrastructure:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./infra/envs/dev/infra

    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. AWS 권한 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. 테라폼 설치
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 4. 테라폼 초기화 (Init)
        run: terraform init

      - name: 5. 🚀 테라폼 자동 적용 (Apply) - 0원 모드 시 2단계 분리 배포
        run: |
          if [ "${{ github.event.inputs.node_desired }}" == "0" ]; then
            echo "📉 비용 0원 모드: 파드들의 안전한 종료를 위해 노드를 먼저 0으로 축소합니다 (NAT 유지)..."
            terraform apply -auto-approve -target="module.eks" -var="node_desired_size=0" -var-file="terraform.ci.tfvars"
            
            echo "🗑️ 노드 축소 완료. 이제 불필요해진 NAT GW를 삭제합니다..."
            terraform apply -auto-approve -var="node_desired_size=0" -var-file="terraform.ci.tfvars"
          else
            echo "📈 운영 모드: NAT GW와 EKS 노드를 프로비저닝합니다..."
            terraform apply -auto-approve -var="node_desired_size=2" -var-file="terraform.ci.tfvars"
          fi