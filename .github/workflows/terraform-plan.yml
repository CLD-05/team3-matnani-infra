name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-northeast-2
  ROLE_ARN: arn:aws:iam::495599735720:role/team3-matnani-dev-gha-role
  TF_VERSION: "1.15.0"
  TF_VAR_slack_workspace_id: ${{ vars.SLACK_WORKSPACE_ID }}
  TF_VAR_slack_channel_id: ${{ vars.SLACK_CHANNEL_ID }}
  TF_VAR_chatbot_role_arn: ${{ vars.CHATBOT_ROLE_ARN }}

jobs:
  plan-dev-infra:
    name: Plan / dev-infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev/infra

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate Chatbot variables
        shell: bash
        run: |
          test -n "${TF_VAR_slack_workspace_id}" || { echo "SLACK_WORKSPACE_ID repository variable is required."; exit 1; }
          test -n "${TF_VAR_slack_channel_id}" || { echo "SLACK_CHANNEL_ID repository variable is required."; exit 1; }
          test -n "${TF_VAR_chatbot_role_arn}" || { echo "CHATBOT_ROLE_ARN repository variable is required."; exit 1; }

      - name: Terraform Init
        run: terraform init

      - name: Read current EKS node count
        id: current_nodes
        run: |
          desired=$(aws eks describe-nodegroup \
            --cluster-name team3-matnani-dev-eks \
            --nodegroup-name team3-matnani-dev-eks-ng \
            --query "nodegroup.scalingConfig.desiredSize" \
            --output text)
          if [ "${desired}" = "0" ]; then
            min=0
          elif [ "${desired}" = "2" ]; then
            min=2
          else
            min=3
          fi
          echo "desired=${desired}" >> "$GITHUB_OUTPUT"
          echo "min=${min}" >> "$GITHUB_OUTPUT"
          echo "현재 EKS 노드 수 ${desired}개를 plan에 사용합니다."

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -lock-timeout=5m \
            -var-file=terraform.ci.tfvars \
            -var="node_desired=${{ steps.current_nodes.outputs.desired }}" \
            -var="node_min=${{ steps.current_nodes.outputs.min }}" \
            2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: PR 코멘트 - dev/infra plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/dev/infra/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) + '\n...(truncated)' : plan;
            const body = `## 📋 Terraform Plan — \`dev/infra\`
            <details><summary>결과 펼치기</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Plan 실패 시 워크플로우 실패 처리
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  plan-dev-platform-addons:
    name: Plan / dev-platform-addons
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev/platform-addons

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -var-file=terraform.ci.tfvars 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: PR 코멘트 - dev/platform-addons plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/dev/platform-addons/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) + '\n...(truncated)' : plan;
            const body = `## 📋 Terraform Plan — \`dev/platform-addons\`
            <details><summary>결과 펼치기</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Plan 실패 시 워크플로우 실패 처리
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

