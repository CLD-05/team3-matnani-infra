# modules/monitoring/values.yaml
# 팀원들의 애플리케이션 매트릭을 수집하기 위한 기본 환경을 정의합니다.

# [1] Grafana (시각화 대시보드)
grafana:
  enabled: true
  adminPassword: "admin"
  defaultDashboardsTimezone: Asia/Seoul
  service:
    type: ClusterIP
  persistence:
    enabled: false

# [2] Prometheus (메트릭 수집기)
prometheus:
  prometheusSpec:
    # 데이터 영구 보존용 스토리지(storageSpec) 블록을 완전히 제거하여 비용 0원 달성
    # 매일 파드가 초기화되므로 보관 주기는 1일로 최소화하여 메모리 낭비 방지

    retention: 1d

    # 다른 네임스페이스(matnani)에 띄울 백엔드 앱을 자동 인식하기 위한 설정
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    
    # 안정적인 수집을 위한 최소 리소스 보장
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

# [3] Alertmanager (알람 발송 컴포넌트)
alertmanager:
  enabled: true
  # 알람 내역을 저장할 외장 하드(EBS)를 만들지 않음
  persistence:
    enabled: false

# [4] 기타 인프라 모니터링 도구
kubeStateMetrics:
  enabled: true

# 불필요한 EKS 기본 경고 규칙 정리 (알람 피로도 감소)
defaultRules:
  create: true
  rules:
    kubeProxy: false